name: Public source checks (no publishing)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-checks-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syntax-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Compile Python source (no tokens needed)
        run: python -m compileall -q .

  offline-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run offline-only unit and function-style regression tests
        env:
          PYTHONUNBUFFERED: '1'
        run: python ci/offline_tests.py
